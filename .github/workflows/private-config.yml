name: Private configuration helpers

on:
  push:
    paths:
      - .github/workflows/private-config.yml
      - scripts/apps
      - scripts/private-config
      - scripts/bootstrap-darwin.sh
      - scripts/rebuild
      - tests/apps-encryption.sh
      - tests/bootstrap-darwin.sh
  pull_request:
    paths:
      - .github/workflows/private-config.yml
      - scripts/apps
      - scripts/private-config
      - scripts/bootstrap-darwin.sh
      - scripts/rebuild
      - tests/apps-encryption.sh
      - tests/bootstrap-darwin.sh
  workflow_dispatch:

permissions:
  contents: read

jobs:
  helpers:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install test tools on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y age shellcheck libdigest-sha-perl openssh-client
      - name: Install test tools on macOS
        if: runner.os == 'macOS'
        run: brew install age shellcheck
      - name: Check shell scripts
        run: |
          for script in scripts/apps scripts/private-config scripts/bootstrap-darwin.sh scripts/rebuild tests/apps-encryption.sh tests/bootstrap-darwin.sh; do
            /bin/bash -n "$script"
          done
          shellcheck scripts/apps scripts/private-config scripts/bootstrap-darwin.sh scripts/rebuild tests/apps-encryption.sh tests/bootstrap-darwin.sh
      - name: Test fresh unlocks and cached use with disposable keys
        run: /bin/bash tests/apps-encryption.sh
      - name: Test bootstrap with isolated command stubs
        run: /bin/bash tests/bootstrap-darwin.sh
